name: KG Regression

# Run the biomapper2 correctness suite against a candidate Kestrel / KG build.
# Use this when Kestrel deploys a new knowledge-graph build, BEFORE pointing
# production at it: the report is stamped with that build's run provenance
# (kg_version, KRAKEN git_commit, sources), so results are pinned to an exact KG.
#
# Trigger from the Actions tab (or `gh workflow run kg-regression.yml`) with the
# candidate URL and a label. Compare timings/coverage only across runs with the
# SAME kg_version — that's what the provenance stamp is for.

on:
  workflow_dispatch:
    inputs:
      kestrel_url:
        description: 'Candidate Kestrel API URL (e.g. https://staging.example.com/api)'
        required: true
        type: string
      tag:
        description: 'Label for this run (used in report filename + metadata)'
        required: true
        default: kg-candidate
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      KESTREL_API_KEY: ${{ secrets.KESTREL_API_KEY }}

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Run correctness suite against candidate KG
      run: |
        uv run pytest -v -m "not third_party and not performance" \
          --kestrel-url "${{ inputs.kestrel_url }}" \
          --tag "${{ inputs.tag }}"

    - name: Write report to step summary
      if: always()
      run: uv run python scripts/report_to_summary.py >> "$GITHUB_STEP_SUMMARY"

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kg-regression-report-${{ inputs.tag }}
        path: reports/*.json
        if-no-files-found: ignore
